name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: tests and quality gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Architecture contracts
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest
      - name: Traceability matrix
        run: uv run python tools/traceability.py
      - uses: actions/upload-artifact@v4
        with:
          name: traceability-py${{ matrix.python-version }}
          path: reports/

  security:
    name: secret scan and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (locked)
        run: uv sync --locked
      - name: Secret scan (SEC-SEC-006)
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline
      - name: Dependency audit
        run: uv run pip-audit --skip-editable

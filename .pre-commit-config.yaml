# Local hooks run through uv so tool versions come from uv.lock (no unpinned remote hooks).
# Install once per clone:  uv sync && uv run pre-commit install
#
# Hooks use `uv run --no-sync`: pre-commit stashes unstaged changes (possibly pyproject.toml)
# before running, and a sync at that moment would rebuild the environment from a different
# configuration. In a OneDrive-synced folder that rebuild also fails (ADR-014). Run `uv sync`
# after changing dependencies; CI always installs from the lock file independently.
repos:
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets (SEC-SEC-006)
        entry: uv run --no-sync detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: ^uv\.lock$
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude --check
        language: system
        types_or: [python, pyi]
      - id: no-athlete-data
        name: block athlete data files (PRIV, threat model R-01)
        entry: athlete data files must not be committed; use synthetic fixtures under tests/fixtures
        language: fail
        files: \.(fit|FIT|tcx|gpx|zip|sqlite3?|db)$
        exclude: ^tests/fixtures/
